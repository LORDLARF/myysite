<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #cfe9ff, #fff4b5);
      color: #333;
      text-align: center;
    }

    header {
      padding: 70px 20px 40px;
    }

    .sun {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #ffe066;
      box-shadow: 0 0 25px rgba(255, 220, 120, 0.6);
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    h2 {
      margin-top: 10px;
      font-weight: normal;
    }

    .about {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 12px;
