<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pixar Gallery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 30px 0;
      font-size: 40px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      width: 220px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card p {
      margin-top: 10px;
      font-size: 18px;
    }

  </style>
</head>

<body>

  <h1>🔥 Персонажи Pixar 🔥</h1>

  <div class="gallery">

    <div class="card">
      <img src="https://cdn.ruwiki.ru/ruwiki/files/thumb/0/04/%D0%91%D0%B0%D0%B7%D0%B7_%D0%9B%D0%B0%D0%B9%D1%82%D0%B5%D1%80.png/554px-%D0%91%D0%B0%D0%B7%D0%B7_%D0%9B%D0%B0%D0%B9%D1%82%D0%B5%D1%80.png">
      <p>Базз Лайтер</p>
    </div>

    <div class="card">
      <img src="https://i.pinimg.com/736x/1d/e9/e8/1de9e8c841dfa3088d7ee6d8735abf4b.jpg">
      <p>Шериф Вуди</p>
    </div>

    <div class="card">
      <img src="https://w7.pngwing.com/pngs/241/794/png-transparent-eve-pixar-wall%C2%B7e-film-wall-e-cartoon-vehicle-desktop-wallpaper.png">
      <p>WALL-E</p>
    </div>

    <div class="card">
      <img src="https://i.ytimg.com/vi/Q0-kdeC-EF0/hqdefault.jpg">
      <p>Молния Маквин</p>
    </div>

  </div>

</body>
</html>
